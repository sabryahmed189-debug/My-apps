name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Prepare Web Assets
        run: |
          mkdir -p www
          cp -r index.html www/
          [ -d css ] && cp -r css www/ || true
          [ -d js ] && cp -r js www/ || true
          [ -d images ] && cp -r images www/ || true

      - name: Initialize and Build Capacitor Project
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          cat <<EOF > capacitor.config.json
          {
            "appId": "com.myapp.web",
            "appName": "MyApp",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF
          npx cap add android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
